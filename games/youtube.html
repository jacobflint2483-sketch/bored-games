
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Player</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: #181818;
  border-bottom: 1px solid #333;
}
.logo { font-size: 23px; font-weight: bold; }
.logo span { color: #ff3030; }
.back {
  background: #303030;
  color: white;
  border: 0;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}
main {
  max-width: 1000px;
  margin: 30px auto;
  padding: 15px;
}
.search {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #444;
  border-radius: 9px;
  background: #222;
  color: white;
  font-size: 16px;
}
button {
  cursor: pointer;
}
.search button {
  background: #ff3030;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 0 20px;
  font-weight: bold;
}
.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}
iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
h2 { margin-top: 22px; }
.hint {
  color: #aaa;
  line-height: 1.6;
  font-size: 14px;
}
.open {
  display: inline-block;
  margin-top: 12px;
  color: #ff5555;
}
@media(max-width: 500px) {
  main { margin: 12px auto; }
  .search button { padding: 0 12px; }
}
</style>
</head>
<body>

<header>
  <button class="back" onclick="goBack()">← Back</button>
  <div class="logo">You<span>Tube</span></div>
</header>

<main>
  <div class="search">
    <input id="search" placeholder="Paste a YouTube link or video ID..." />
    <button onclick="playVideo()">Play</button>
  </div>

  <div class="player">
    <iframe
      id="video"
      src="about:blank"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <h2 id="title">Welcome to YouTube</h2>
  <p class="hint">
    Paste a YouTube video link above and press Play.
    You can use links from youtube.com or youtu.be.
  </p>
  <a class="open" id="openLink" href="https://www.youtube.com/" target="_blank" rel="noopener">
    Open YouTube in a new tab
  </a>
</main>

<script>
function getVideoId(value) {
  value = value.trim();

  if (/^[a-zA-Z0-9_-]{11}$/.test(value)) return value;

  try {
    const url = new URL(value);
    let id = "";

    if (url.hostname === "youtu.be" || url.hostname.endsWith(".youtu.be")) {
      id = url.pathname.split("/").filter(Boolean)[0] || "";
    } else if (url.hostname.includes("youtube.com")) {
      if (url.pathname === "/watch") {
        id = url.searchParams.get("v") || "";
      } else {
        const parts = url.pathname.split("/").filter(Boolean);
        if (["embed", "shorts", "live"].includes(parts[0])) {
          id = parts[1] || "";
        }
      }
    }

    return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : "";
  } catch {
    return "";
  }
}

function playVideo() {
  const input = document.getElementById("search").value;
  const id = getVideoId(input);

  if (!id) {
    alert("Please enter a valid YouTube video link or ID.");
    return;
  }

  document.getElementById("video").src =
    "https://www.youtube-nocookie.com/embed/" + id;

  document.getElementById("title").textContent = "Now playing";
  document.getElementById("openLink").href =
    "https://www.youtube.com/watch?v=" + id;
}

document.getElementById("search").addEventListener("keydown", e => {
  if (e.key === "Enter") playVideo();
});

function goBack() {
  if (history.length > 1) history.back();
  else location.href = "../index.html";
}
</script>

</body>
</html>
