<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Code Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e1e1e;
      color: #fff;
      overflow: hidden;
    }

    /* Top Toolbar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #252526;
      border-bottom: 1px solid #333;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .controls label {
      font-size: 13px;
      color: #bbb;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    button {
      background: #0e639c;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s;
    }

    button:hover {
      background: #1177bb;
    }

    button.clear-btn {
      background: #3a3d41;
    }

    button.clear-btn:hover {
      background: #4e5157;
    }

    /* Split Workspace */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 51px);
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-header {
      background: #2d2d2d;
      padding: 6px 14px;
      font-size: 12px;
      color: #9cdcfe;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #3c3c3c;
    }

    /* Code Input */
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: "Fira Code", Consolas, Monaco, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.5;
      padding: 14px;
      resize: none;
      tab-size: 2;
    }

    /* Divider */
    .divider {
      width: 2px;
      background: #333;
    }

    /* Result Preview Frame */
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">&lt;/&gt; HTML Code Runner</div>
    <div class="controls">
      <label>
        <input type="checkbox" id="auto-run" checked />
        Auto Run
      </label>
      <button class="clear-btn" id="clear-btn">Clear</button>
      <button id="run-btn">Run Code ▶</button>
    </div>
  </header>

  <main class="workspace">
    <!-- Left: Code Editor -->
    <div class="panel">
      <div class="panel-header">Source Code (HTML / CSS / JS)</div>
      <textarea id="code" spellcheck="false" placeholder="Write your HTML code here..."><!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
      background: #f9f9f9;
    }
    h1 { color: #007acc; }
    button {
      padding: 10px 18px;
      font-size: 15px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hello from the HTML Runner!</h1>
  <p>Edit the code on the left to see live changes.</p>
  <button onclick="alert('Working smoothly!')">Click Me</button>
</body>
</html></textarea>
    </div>

    <div class="divider"></div>

    <!-- Right: Live Output -->
    <div class="panel">
      <div class="panel-header" style="color: #4ec9b0;">Live Preview</div>
      <iframe id="preview" sandbox="allow-scripts allow-modals"></iframe>
    </div>
  </main>

  <script>
    const codeInput = document.getElementById('code');
    const preview = document.getElementById('preview');
    const runBtn = document.getElementById('run-btn');
    const clearBtn = document.getElementById('clear-btn');
    const autoRunCheckbox = document.getElementById('auto-run');

    function runCode() {
      // Use srcdoc to safely inject and execute the content
      preview.srcdoc = codeInput.value;
    }

    // Support Tab key inside the textarea
    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = codeInput.selectionStart;
        const end = codeInput.selectionEnd;

        codeInput.value = codeInput.value.substring(0, start) + '  ' + codeInput.value.substring(end);
        codeInput.selectionStart = codeInput.selectionEnd = start + 2;

        if (autoRunCheckbox.checked) runCode();
      }
    });

    // Auto-run with slight debounce
    let debounceTimer;
    codeInput.addEventListener('input', () => {
      if (autoRunCheckbox.checked) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(runCode, 300);
      }
    });

    runBtn.addEventListener('click', runCode);

    clearBtn.addEventListener('click', () => {
      codeInput.value = '';
      preview.srcdoc = '';
      codeInput.focus();
    });

    // Initial render on page load
    runCode();
  </script>
</body>
</html>
