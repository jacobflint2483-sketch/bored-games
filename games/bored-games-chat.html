
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bored Games Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#7058ed;color:white;font-weight:700}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{background:#111a30;color:white;border:1px solid #293653;border-radius:9px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:#8b78ff}
small,.muted{color:#94a3b8}
#auth{max-width:420px;margin:9vh auto;padding:28px;background:#151e33;border:1px solid #293653;border-radius:18px}
.logo{font-size:27px;font-weight:900;margin-bottom:7px}
.logo span{color:#9a89ff}
#auth h2{margin-top:25px}
#auth input{margin:7px 0}
.auth-actions{display:flex;gap:9px;margin-top:12px}
.auth-actions button{flex:1}
#authMessage{min-height:22px;color:#fca5a5;margin-top:12px;font-size:14px}
#app{display:none;height:100vh;min-height:500px}
.topbar{height:62px;border-bottom:1px solid #26334c;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111a2d}
.topbar .logo{font-size:20px;margin:0}
.user-area{display:flex;align-items:center;gap:12px}
.user-area button{padding:8px 12px;background:#293653}
.layout{height:calc(100vh - 62px);display:grid;grid-template-columns:245px 1fr}
.sidebar{background:#10182a;border-right:1px solid #26334c;padding:16px;overflow-y:auto}
.side-heading{font-size:11px;color:#8290aa;font-weight:800;letter-spacing:1.5px;margin:8px 0 13px}
.room{width:100%;display:block;text-align:left;background:transparent;color:#cbd5e1;margin:4px 0;padding:12px;border-radius:9px}
.room.active{background:#29234e;color:#c4baff}
#addRoom{width:100%;margin-top:15px;background:#24314c}
.chat{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:17px 22px;border-bottom:1px solid #26334c;display:flex;justify-content:space-between;align-items:center}
.chat-head h2{font-size:19px;margin:0}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:13px}
.message{background:#151f34;border:1px solid #263653;border-radius:12px;padding:12px 14px;max-width:850px;width:fit-content;min-width:180px}
.message.mine{border-color:#5747a8;background:#1c1b3b}
.msg-top{display:flex;gap:12px;align-items:center;margin-bottom:7px}
.msg-name{font-weight:800;color:#b9adff}
.msg-time{font-size:11px;color:#8290aa}
.msg-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.msg-actions{display:flex;gap:7px;margin-top:9px}
.msg-actions button{font-size:11px;padding:5px 8px;background:#293653}
.msg-actions .delete{background:#713344}
.composer{padding:15px 20px;border-top:1px solid #26334c;display:flex;gap:10px;background:#10182a}
.composer textarea{resize:none;height:48px;max-height:120px}
.composer button{min-width:85px}
#status{font-size:12px;color:#94a3b8}
#notice{padding:9px 20px;color:#fca5a5;font-size:13px;min-height:18px}
.empty{color:#94a3b8;text-align:center;margin:auto}
.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#151e33;border:1px solid #354565;border-radius:15px;padding:22px;width:min(400px,100%)}
.modal input{margin:12px 0}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:650px){
 .layout{grid-template-columns:115px 1fr}
 .sidebar{padding:9px}
 .room{font-size:12px;padding:10px 7px;overflow-wrap:anywhere}
 .side-heading{font-size:9px}
 .topbar{padding:0 10px}
 .topbar .logo{font-size:16px}
 .user-area{gap:5px;font-size:12px}
 .user-area button{font-size:11px;padding:8px}
 .chat-head{padding:13px}
 #messages{padding:12px}
 .composer{padding:10px}
 .composer button{min-width:65px;padding:8px}
}
</style>
</head>
<body>

<section id="auth">
 <div class="logo">BORED <span>GAMES</span></div>
 <div class="muted">Community chat</div>
 <h2 id="authTitle">Welcome back</h2>
 <p class="muted" id="authDescription">Log in to join the conversation.</p>
 <input id="username" placeholder="Username" maxlength="20" autocomplete="username">
 <input id="password" type="password" placeholder="Password" autocomplete="current-password">
 <div class="auth-actions">
  <button id="loginBtn">Log in</button>
  <button id="signupBtn">Create account</button>
 </div>
 <div id="authMessage"></div>
 <small>Usernames: 3–20 letters, numbers or underscores. Passwords: at least 8 characters.</small>
</section>

<section id="app">
 <header class="topbar">
  <div class="logo">BORED <span>GAMES</span> CHAT</div>
  <div class="user-area">
   <span id="currentUser"></span>
   <button id="logoutBtn">Log out</button>
  </div>
 </header>

 <div class="layout">
  <aside class="sidebar">
   <div class="side-heading">CHAT ROOMS</div>
   <div id="rooms"></div>
   <button id="addRoom" style="display:none">+ Create room</button>
  </aside>

  <main class="chat">
   <div class="chat-head">
    <h2 id="roomTitle">Public Chat</h2>
    <span id="status">Connecting...</span>
   </div>
   <div id="notice"></div>
   <div id="messages"><div class="empty">Loading chat...</div></div>
   <form class="composer" id="messageForm">
    <textarea id="messageInput" maxlength="500" placeholder="Write a message..." required></textarea>
    <button id="sendBtn">Send</button>
   </form>
  </main>
 </div>
</section>

<div class="modal-bg" id="roomModal">
 <div class="modal">
  <h2>Create a room</h2>
  <p class="muted">Only the chat owner can create rooms.</p>
  <input id="newRoomName" maxlength="30" placeholder="Room name">
  <div class="modal-actions">
   <button id="cancelRoom" style="background:#293653">Cancel</button>
   <button id="confirmRoom">Create</button>
  </div>
  <div id="roomError" class="muted"></div>
 </div>
</div>

<script>
const SUPABASE_URL = "https://jxfbnahykmivqsziftvt.supabase.co";
const SUPABASE_KEY = "sb_publishable_UKC4_3dM6mlrqt0vCdg_E8kuQBto";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let currentUser = null;
let currentRoom = null;
let isAdmin = false;
let messageChannel = null;
let roomsCache = [];

function authEmail(name) {
 return name.trim().toLowerCase() + "@boredgames.example.com";
}

function validUsername(name) {
 return /^[a-z0-9_]{3,20}$/i.test(name);
}

function showAuthMessage(message) {
 $("authMessage").textContent = message;
}

function showNotice(message) {
 $("notice").textContent = message;
}

function formatTime(date) {
 return new Date(date).toLocaleTimeString([], {
  hour:"2-digit", minute:"2-digit"
 });
}

async function signUp() {
 const username = $("username").value.trim();
 const password = $("password").value;

 if (!validUsername(username)) {
  showAuthMessage("Username must be 3–20 characters and use only letters, numbers or underscores.");
  return;
 }
 if (password.length < 8) {
  showAuthMessage("Your password must be at least 8 characters.");
  return;
 }

 $("signupBtn").disabled = true;
 showAuthMessage("Creating your account...");

 const {data, error} = await db.auth.signUp({
  email: authEmail(username),
  password,
  options: {
   data: {nickname: username}
  }
 });

 $("signupBtn").disabled = false;

 if (error) {
  showAuthMessage(error.message);
  return;
 }

 if (!data.session) {
  showAuthMessage("Account created, but email confirmation is still enabled in Supabase. Turn off Confirm email in the Email provider settings before new players can log in.");
  return;
 }

 showAuthMessage("");
 await startApp(data.session.user);
}

async function logIn() {
 const username = $("username").value.trim();
 const password = $("password").value;

 if (!validUsername(username)) {
  showAuthMessage("Enter a valid username.");
  return;
 }
 if (!password) {
  showAuthMessage("Enter your password.");
  return;
 }

 $("loginBtn").disabled = true;
 showAuthMessage("Logging in...");

 const {data, error} = await db.auth.signInWithPassword({
  email: authEmail(username),
  password
 });

 $("loginBtn").disabled = false;

 if (error) {
  showAuthMessage("Login failed. Check your username and password.");
  return;
 }

 showAuthMessage("");
 await startApp(data.user);
}

async function startApp(user) {
 currentUser = user;
 const username = user.user_metadata?.nickname ||
  user.email?.split("@")[0] || "Player";

 $("currentUser").textContent = username;
 $("auth").style.display = "none";
 $("app").style.display = "block";

 const {data: adminResult, error: adminError} =
  await db.rpc("is_chat_admin");

 isAdmin = !adminError && adminResult === true;
 $("addRoom").style.display = isAdmin ? "block" : "none";

 await loadRooms();
 $("status").textContent = "Connected";
}

async function logOut() {
 if (messageChannel) {
  await db.removeChannel(messageChannel);
  messageChannel = null;
 }
 await db.auth.signOut();
 currentUser = null;
 currentRoom = null;
 $("app").style.display = "none";
 $("auth").style.display = "block";
 $("password").value = "";
 showAuthMessage("");
}

async function loadRooms() {
 const {data, error} = await db
  .from("chat_rooms")
  .select("*")
  .order("created_at", {ascending:true});

 if (error) {
  showNotice("Couldn't load rooms: " + error.message);
  return;
 }

 roomsCache = data || [];
 $("rooms").replaceChildren();

 roomsCache.forEach(room => {
  const button = document.createElement("button");
  button.className = "room" +
   (currentRoom?.id === room.id ? " active" : "");
  button.textContent = " # " + room.name;
  button.addEventListener("click", () => selectRoom(room));
  $("rooms").appendChild(button);
 });

 if (!currentRoom && roomsCache.length) {
  const first = roomsCache.find(r =>
   r.name.toLowerCase() === "public chat"
  ) || roomsCache[0];
  await selectRoom(first);
 }
}

async function selectRoom(room) {
 currentRoom = room;
 $("roomTitle").textContent = room.name;
 $("messages").replaceChildren();
 $("messages").innerHTML = '<div class="empty">Loading messages...</div>';

 document.querySelectorAll(".room").forEach((button, index) => {
  button.classList.toggle("active", roomsCache[index]?.id === room.id);
 });

 if (messageChannel) {
  await db.removeChannel(messageChannel);
  messageChannel = null;
 }

 await loadMessages();

 messageChannel = db.channel("room-" + room.id)
  .on("postgres_changes", {
   event:"INSERT",
   schema:"public",
   table:"chat_messages",
   filter:"room_id=eq." + room.id
  }, payload => {
   addMessage(payload.new);
  })
  .on("postgres_changes", {
   event:"DELETE",
   schema:"public",
   table:"chat_messages"
  }, payload => {
   const element = document.getElementById("message-" + payload.old.id);
   if (element) element.remove();
  })
  .subscribe(status => {
   $("status").textContent =
    status === "SUBSCRIBED" ? "Live" : "Connecting...";
  });
}

async function loadMessages() {
 const {data, error} = await db
  .from("chat_messages")
  .select("*")
  .eq("room_id", currentRoom.id)
  .order("created_at", {ascending:false})
  .limit(100);

 if (error) {
  showNotice("Couldn't load messages: " + error.message);
  return;
 }

 $("messages").replaceChildren();

 const messages = (data || []).reverse();

 if (!messages.length) {
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.textContent = "No messages yet. Start the conversation!";
  $("messages").appendChild(empty);
  return;
 }

 messages.forEach(addMessage);
 scrollToBottom();
}

function addMessage(message) {
 if (!message || document.getElementById("message-" + message.id)) return;
 if (message.room_id !== currentRoom?.id) return;

 const empty = $("messages").querySelector(".empty");
 if (empty) empty.remove();

 const mine = message.user_id === currentUser.id;
 const wrapper = document.createElement("div");
 wrapper.className = "message" + (mine ? " mine" : "");
 wrapper.id = "message-" + message.id;

 const top = document.createElement("div");
 top.className = "msg-top";

 const name = document.createElement("span");
 name.className = "msg-name";
 name.textContent = message.nickname || "Player";

 const time = document.createElement("span");
 time.className = "msg-time";
 time.textContent = formatTime(message.created_at);

 top.append(name, time);

 const text = document.createElement("div");
 text.className = "msg-text";
 text.textContent = message.message;

 wrapper.append(top, text);

 const actions = document.createElement("div");
 actions.className = "msg-actions";

 if (!mine) {
  const report = document.createElement("button");
  report.textContent = "Report";
  report.addEventListener("click", () => reportMessage(message));
  actions.appendChild(report);
 }

 if (isAdmin) {
  const del = document.createElement("button");
  del.textContent = "Delete";
  del.className = "delete";
  del.addEventListener("click", () => deleteMessage(message));
  actions.appendChild(del);
 }

 if (actions.children.length) wrapper.appendChild(actions);

 $("messages").appendChild(wrapper);
 scrollToBottom();
}

function scrollToBottom() {
 $("messages").scrollTop = $("messages").scrollHeight;
}

async function sendMessage(event) {
 event.preventDefault();

 const value = $("messageInput").value.trim();
 if (!value || !currentRoom) return;

 $("sendBtn").disabled = true;
 showNotice("");

 const {error} = await db.from("chat_messages").insert({
  room_id: currentRoom.id,
  user_id: currentUser.id,
  nickname: currentUser.user_metadata?.nickname ||
   currentUser.email?.split("@")[0] || "Player",
  message: value
 });

 $("sendBtn").disabled = false;

 if (error) {
  showNotice(error.message);
  return;
 }

 $("messageInput").value = "";
}

async function reportMessage(message) {
 const reason = prompt("Why are you reporting this message?");
 if (!reason || !reason.trim()) return;

 const {error} = await db.from("chat_reports").insert({
  message_id: message.id,
  reporter_id: currentUser.id,
  reason: reason.trim().slice(0,250)
 });

 if (error) {
  showNotice("Couldn't send report: " + error.message);
 } else {
  showNotice("Report sent to the chat owner.");
 }
}

async function deleteMessage(message) {
 if (!confirm("Delete this message?")) return;

 const {error} = await db.from("chat_messages")
  .delete()
  .eq("id", message.id);

 if (error) showNotice("Couldn't delete message: " + error.message);
}

function openRoomModal() {
 $("newRoomName").value = "";
 $("roomError").textContent = "";
 $("roomModal").style.display = "flex";
}

async function createRoom() {
 if (!isAdmin) return;

 const name = $("newRoomName").value.trim();
 if (name.length < 2 || name.length > 30) {
  $("roomError").textContent = "Room names must be 2–30 characters.";
  return;
 }

 $("confirmRoom").disabled = true;

 const {error} = await db.from("chat_rooms").insert({name});

 $("confirmRoom").disabled = false;

 if (error) {
  $("roomError").textContent = error.message;
  return;
 }

 $("roomModal").style.display = "none";
 await loadRooms();
}

$("loginBtn").addEventListener("click", logIn);
$("signupBtn").addEventListener("click", signUp);
$("logoutBtn").addEventListener("click", logOut);
$("messageForm").addEventListener("submit", sendMessage);
$("addRoom").addEventListener("click", openRoomModal);
$("cancelRoom").addEventListener("click", () => {
 $("roomModal").style.display = "none";
});
$("confirmRoom").addEventListener("click", createRoom);

$("password").addEventListener("keydown", event => {
 if (event.key === "Enter") logIn();
});

$("messageInput").addEventListener("keydown", event => {
 if (event.key === "Enter" && !event.shiftKey) {
  event.preventDefault();
  $("messageForm").requestSubmit();
 }
});

(async function initialise() {
 const {data} = await db.auth.getSession();
 if (data.session) {
  await startApp(data.session.user);
 }
})();
</script>
</body>
</html>
