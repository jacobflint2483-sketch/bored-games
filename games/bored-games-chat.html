
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bored Games Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10121a;
  color: #f2f3f8;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  color: white;
  background: #6658e8;
  font-weight: bold;
}

button:hover {
  filter: brightness(1.12);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #343747;
  border-radius: 9px;
  outline: none;
  background: #191c28;
  color: white;
}

input:focus, textarea:focus {
  border-color: #8175ff;
}

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 410px;
  padding: 30px;
  background: #191c28;
  border: 1px solid #303445;
  border-radius: 17px;
  box-shadow: 0 15px 50px #0005;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #999eb2;
  margin-bottom: 25px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  color: #c4c7d4;
  font-size: 14px;
}

.full-button {
  width: 100%;
  margin-top: 8px;
}

.secondary-button {
  background: #303445;
}

#authMessage {
  color: #ff9a9a;
  font-size: 13px;
  margin-top: 15px;
  min-height: 18px;
  line-height: 1.5;
}

#chatScreen {
  display: none;
  height: 100vh;
  min-height: 500px;
}

.app {
  height: 100%;
  display: flex;
}

.sidebar {
  width: 255px;
  flex-shrink: 0;
  background: #171a25;
  border-right: 1px solid #303445;
  display: flex;
  flex-direction: column;
  padding: 18px;
}

.sidebar-logo {
  font-size: 21px;
  font-weight: 900;
  margin-bottom: 25px;
}

.sidebar-heading {
  color: #9298ad;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  margin: 12px 0;
}

#rooms {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow-y: auto;
}

.room-button {
  width: 100%;
  text-align: left;
  background: transparent;
  color: #c3c7d5;
  font-weight: normal;
}

.room-button.active {
  background: #34304f;
  color: white;
}

.sidebar-bottom {
  margin-top: auto;
  padding-top: 20px;
}

#userLabel {
  color: #aeb3c5;
  font-size: 13px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

#adminTools {
  display: none;
  border-top: 1px solid #303445;
  padding-top: 15px;
  margin-top: 15px;
}

#adminTools button {
  width: 100%;
  margin-bottom: 8px;
  background: #5141a9;
}

#adminTools .danger {
  background: #a83e4a;
}

#logoutButton {
  width: 100%;
  background: #303445;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 70px;
  border-bottom: 1px solid #303445;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 22px;
  gap: 12px;
}

#roomTitle {
  font-size: 20px;
  font-weight: bold;
}

#connectionStatus {
  color: #9ca3b8;
  font-size: 12px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  background: #1b1e2b;
  border: 1px solid #303445;
  border-radius: 12px;
  padding: 13px 15px;
  max-width: 850px;
  width: 100%;
  align-self: center;
}

.message-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.message-name {
  font-weight: bold;
  color: #a99fff;
}

.message-time {
  color: #858ba0;
  font-size: 11px;
}

.message-text {
  color: #e5e6ed;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.message-actions button {
  padding: 6px 9px;
  font-size: 11px;
  background: #303445;
}

.message-actions .delete-button {
  background: #913b47;
}

.composer {
  padding: 16px 22px;
  border-top: 1px solid #303445;
  display: flex;
  gap: 10px;
  background: #171a25;
}

.composer input {
  flex: 1;
  min-width: 0;
}

.composer button {
  min-width: 85px;
}

.notice {
  color: #8e94a9;
  text-align: center;
  padding: 20px;
  font-size: 13px;
}

#reportPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000a;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal {
  width: 100%;
  max-width: 420px;
  background: #1b1e2b;
  border: 1px solid #41465a;
  border-radius: 15px;
  padding: 22px;
  max-height: 85vh;
  overflow-y: auto;
}

.modal h2 {
  margin-top: 0;
}

.modal textarea {
  resize: vertical;
  min-height: 90px;
  margin: 12px 0;
}

.modal-actions {
  display: flex;
  gap: 10px;
}

.modal-actions button {
  flex: 1;
}

.report-item {
  background: #292d3d;
  border-radius: 9px;
  padding: 12px;
  margin: 10px 0;
  overflow-wrap: anywhere;
}

.report-item small {
  color: #a5abc0;
}

#adminMessage {
  color: #a5abc0;
  font-size: 13px;
  margin-top: 10px;
}

@media (max-width: 650px) {
  .sidebar {
    width: 125px;
    padding: 10px;
  }

  .sidebar-logo {
    font-size: 16px;
  }

  .room-button {
    padding: 10px 6px;
    font-size: 12px;
  }

  .topbar {
    padding: 12px;
  }

  #messages {
    padding: 12px;
  }

  .composer {
    padding: 10px;
  }

  .composer button {
    min-width: 65px;
    padding: 10px;
  }

  .message {
    padding: 11px;
  }
}

@media (max-width: 390px) {
  .sidebar {
    width: 105px;
  }

  .sidebar-logo {
    font-size: 14px;
  }

  #userLabel {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="logo">BORED GAMES</div>
    <div class="subtitle">Community Chat</div>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" maxlength="20" placeholder="Choose a username" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="At least 8 characters" autocomplete="current-password">
    </div>

    <button class="full-button" id="loginButton">Log in</button>
    <button class="full-button secondary-button" id="signupButton">Create account</button>

    <div id="authMessage"></div>
  </div>
</section>

<section id="chatScreen">
  <div class="app">

    <aside class="sidebar">
      <div class="sidebar-logo">BORED GAMES</div>

      <div class="sidebar-heading">CHAT ROOMS</div>
      <div id="rooms">
        <div class="notice">Loading rooms...</div>
      </div>

      <div class="sidebar-bottom">
        <div id="userLabel"></div>

        <div id="adminTools">
          <button id="createRoomButton">+ Create room</button>
          <button id="reportsButton">View reports</button>
        </div>

        <button id="logoutButton">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div id="roomTitle">Public Chat</div>
        <div id="connectionStatus">Connecting...</div>
      </header>

      <div id="messages">
        <div class="notice">Loading messages...</div>
      </div>

      <form class="composer" id="messageForm">
        <input id="messageInput" maxlength="1000" placeholder="Write a message..." autocomplete="off">
        <button id="sendButton" type="submit">Send</button>
      </form>
    </main>

  </div>
</section>

<div id="reportPanel">
  <div class="modal">
    <h2 id="modalTitle">Reports</h2>
    <div id="modalContent"></div>
    <div id="adminMessage"></div>
    <div class="modal-actions" style="margin-top:15px">
      <button class="secondary-button" id="closeModalButton">Close</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* SUPABASE CONNECTION */

const SUPABASE_URL = "https://jxfbnahykmivqsziftvt.supabase.co";

const SUPABASE_KEY = "sb_publishable_UKC4_3dM6mlrqt3bt0vCdg_E8kuQBto";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ELEMENTS */

const loginScreen = document.getElementById("loginScreen");
const chatScreen = document.getElementById("chatScreen");

const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const authMessage = document.getElementById("authMessage");

const roomsElement = document.getElementById("rooms");
const messagesElement = document.getElementById("messages");

const roomTitle = document.getElementById("roomTitle");
const messageInput = document.getElementById("messageInput");
const connectionStatus = document.getElementById("connectionStatus");

const reportPanel = document.getElementById("reportPanel");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");


/* APP STATE */

let currentUser = null;
let currentUsername = "";
let currentRoom = null;
let isAdmin = false;

let rooms = [];
let realtimeChannel = null;
let currentMessages = [];
let loadingMessages = false;


/* HELPERS */

function showAuthMessage(message) {
  authMessage.textContent = message;
}

function authEmail(username) {
  return username.trim().toLowerCase() + "@boredgames.example.com";
}

function validUsername(username) {
  return /^[a-z0-9_]{3,20}$/i.test(username);
}

function showChat() {
  loginScreen.style.display = "none";
  chatScreen.style.display = "block";
}

function showLogin() {
  chatScreen.style.display = "none";
  loginScreen.style.display = "flex";
}

function formatTime(dateString) {
  const date = new Date(dateString);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function setConnectionStatus(message) {
  connectionStatus.textContent = message;
}

function showModal(title, content) {
  modalTitle.textContent = title;
  modalContent.replaceChildren();
  modalContent.appendChild(content);
  reportPanel.style.display = "flex";
}

function closeModal() {
  reportPanel.style.display = "none";
  modalContent.replaceChildren();
}


/* SIGN UP */

async function signUp() {
  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  showAuthMessage("");

  if (!validUsername(username)) {
    showAuthMessage("Username must be 3–20 characters and use only letters, numbers or underscores.");
    return;
  }

  if (password.length < 8) {
    showAuthMessage("Your password must be at least 8 characters.");
    return;
  }

  const button = document.getElementById("signupButton");
  button.disabled = true;
  button.textContent = "Creating account...";

  try {
    const { data, error } = await db.auth.signUp({
      email: authEmail(username),
      password: password,
      options: {
        data: {
          nickname: username
        }
      }
    });

    if (error) throw error;

    if (!data.session) {
      showAuthMessage(
        "Account created, but email confirmation is enabled in Supabase. Ask the project owner to turn off email confirmation before using username-only registration."
      );
      return;
    }

    showAuthMessage("Account created. Signing you in...");
  } catch (error) {
    showAuthMessage(error.message || "Could not create your account.");
  } finally {
    button.disabled = false;
    button.textContent = "Create account";
  }
}


/* LOG IN */

async function logIn() {
  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  showAuthMessage("");

  if (!validUsername(username)) {
    showAuthMessage("Enter a valid username.");
    return;
  }

  if (!password) {
    showAuthMessage("Enter your password.");
    return;
  }

  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "Logging in...";

  try {
    const { error } = await db.auth.signInWithPassword({
      email: authEmail(username),
      password: password
    });

    if (error) throw error;
  } catch (error) {
    showAuthMessage(error.message || "Login failed.");
  } finally {
    button.disabled = false;
    button.textContent = "Log in";
  }
}


/* START APP */

async function startApp(user) {
  currentUser = user;

  currentUsername =
    user.user_metadata?.nickname ||
    user.email?.split("@")[0] ||
    "Player";

  document.getElementById("userLabel").textContent =
    "Logged in as " + currentUsername;

  showChat();
  setConnectionStatus("Loading...");

  try {
    const { data, error } = await db.rpc("is_chat_admin");

    if (error) throw error;

    isAdmin = data === true;

    document.getElementById("adminTools").style.display =
      isAdmin ? "block" : "none";

    await loadRooms();

    if (rooms.length > 0) {
      await selectRoom(rooms[0]);
    } else {
      roomsElement.textContent = "No rooms available.";
      messagesElement.textContent = "No chat rooms have been created.";
      setConnectionStatus("No rooms");
    }
  } catch (error) {
    console.error(error);
    setConnectionStatus("Connection error");
    messagesElement.textContent =
      "Could not load the chat. Check your Supabase tables and permissions.";
  }
}


/* LOAD ROOMS */

async function loadRooms() {
  const { data, error } = await db
    .from("chat_rooms")
    .select("id, name, created_at")
    .order("created_at", { ascending: true });

  if (error) throw error;

  rooms = data || [];
  renderRooms();
}

function renderRooms() {
  roomsElement.replaceChildren();

  rooms.forEach(room => {
    const button = document.createElement("button");

    button.className = "room-button";
    button.textContent = "# " + room.name;

    if (currentRoom && currentRoom.id === room.id) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      selectRoom(room);
    });

    roomsElement.appendChild(button);
  });
}


/* SELECT ROOM */

async function selectRoom(room) {
  currentRoom = room;

  roomTitle.textContent = room.name;
  renderRooms();

  messagesElement.replaceChildren();

  const loading = document.createElement("div");
  loading.className = "notice";
  loading.textContent = "Loading messages...";
  messagesElement.appendChild(loading);

  if (realtimeChannel) {
    await db.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  await loadMessages();
  subscribeToMessages(room.id);
}


/* LOAD MESSAGES */

async function loadMessages() {
  if (!currentRoom) return;

  loadingMessages = true;

  const { data, error } = await db
    .from("chat_messages")
    .select("id, room_id, user_id, nickname, message, created_at")
    .eq("room_id", currentRoom.id)
    .order("created_at", { ascending: true })
    .limit(100);

  loadingMessages = false;

  if (error) {
    console.error(error);
    messagesElement.textContent = "Could not load messages.";
    return;
  }

  currentMessages = data || [];
  renderMessages();
}


/* RENDER MESSAGES */

function renderMessages() {
  messagesElement.replaceChildren();

  if (currentMessages.length === 0) {
    const empty = document.createElement("div");
    empty.className = "notice";
    empty.textContent = "No messages yet. Start the conversation!";
    messagesElement.appendChild(empty);
    return;
  }

  currentMessages.forEach(message => {
    const card = document.createElement("div");
    card.className = "message";

    const header = document.createElement("div");
    header.className = "message-header";

    const name = document.createElement("span");
    name.className = "message-name";
    name.textContent = message.nickname || "Player";

    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = formatTime(message.created_at);

    header.append(name, time);

    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = message.message;

    card.append(header, text);

    const actions = document.createElement("div");
    actions.className = "message-actions";

    if (message.user_id !== currentUser.id) {
      const reportButton = document.createElement("button");
      reportButton.textContent = "Report";
      reportButton.addEventListener("click", () => {
        reportMessage(message);
      });
      actions.appendChild(reportButton);
    }

    if (isAdmin) {
      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.textContent = "Delete";
      deleteButton.addEventListener("click", () => {
        deleteMessage(message);
      });
      actions.appendChild(deleteButton);
    }

    if (actions.children.length > 0) {
      card.appendChild(actions);
    }

    messagesElement.appendChild(card);
  });

  messagesElement.scrollTop = messagesElement.scrollHeight;
}


/* SEND MESSAGE */

async function sendMessage(event) {
  event.preventDefault();

  const message = messageInput.value.trim();

  if (!message || !currentRoom || !currentUser) return;

  if (message.length > 1000) {
    alert("Messages must be 1000 characters or fewer.");
    return;
  }

  const sendButton = document.getElementById("sendButton");
  sendButton.disabled = true;

  try {
    const { error } = await db
      .from("chat_messages")
      .insert({
        room_id: currentRoom.id,
        user_id: currentUser.id,
        nickname: currentUsername,
        message: message
      });

    if (error) throw error;

    messageInput.value = "";
  } catch (error) {
    alert("Message could not be sent: " + error.message);
  } finally {
    sendButton.disabled = false;
    messageInput.focus();
  }
}


/* LIVE MESSAGES */

function subscribeToMessages(roomId) {
  realtimeChannel = db
    .channel("chat-room-" + roomId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "chat_messages",
        filter: "room_id=eq." + roomId
      },
      async () => {
        if (!loadingMessages && currentRoom?.id === roomId) {
          await loadMessages();
        }
      }
    )
    .subscribe(status => {
      if (status === "SUBSCRIBED") {
        setConnectionStatus("Live");
      } else if (status === "CHANNEL_ERROR") {
        setConnectionStatus("Connection problem");
      } else if (status === "CLOSED") {
        setConnectionStatus("Disconnected");
      }
    });
}


/* REPORT MESSAGE */

async function reportMessage(message) {
  const reason = prompt(
    "Why are you reporting this message? Please explain briefly."
  );

  if (!reason || !reason.trim()) return;

  try {
    const { error } = await db
      .from("chat_reports")
      .insert({
        message_id: message.id,
        reporter_id: currentUser.id,
        reason: reason.trim()
      });

    if (error) throw error;

    alert("Report submitted. Thank you.");
  } catch (error) {
    alert("Could not submit report: " + error.message);
  }
}


/* ADMIN: DELETE MESSAGE */

async function deleteMessage(message) {
  if (!isAdmin) return;

  if (!confirm("Delete this message?")) return;

  try {
    const { error } = await db
      .from("chat_messages")
      .delete()
      .eq("id", message.id);

    if (error) throw error;

    await loadMessages();
  } catch (error) {
    alert("Could not delete message: " + error.message);
  }
}


/* ADMIN: CREATE ROOM */

async function createRoom() {
  if (!isAdmin) return;

  const name = prompt("Enter the new room name:");

  if (!name || !name.trim()) return;

  const cleanName = name.trim();

  if (cleanName.length > 30) {
    alert("Room names must be 30 characters or fewer.");
    return;
  }

  try {
    const { error } = await db
      .from("chat_rooms")
      .insert({ name: cleanName });

    if (error) throw error;

    await loadRooms();
    alert("Room created.");
  } catch (error) {
    alert("Could not create room: " + error.message);
  }
}


/* ADMIN: VIEW REPORTS */

async function viewReports() {
  if (!isAdmin) return;

  modalTitle.textContent = "Chat Reports";
  modalContent.textContent = "Loading reports...";
  reportPanel.style.display = "flex";

  try {
    const { data, error } = await db
      .from("chat_reports")
      .select("id, message_id, reporter_id, reason, created_at")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) throw error;

    modalContent.replaceChildren();

    if (!data || data.length === 0) {
      modalContent.textContent = "There are no reports.";
      return;
    }

    data.forEach(report => {
      const item = document.createElement("div");
      item.className = "report-item";

      const reason = document.createElement("div");
      reason.textContent = "Reason: " + report.reason;

      const details = document.createElement("small");
      details.textContent =
        "Report ID: " + report.id +
        " | Message ID: " + report.message_id +
        " | Reporter: " + report.reporter_id;

      item.append(reason, details);
      modalContent.appendChild(item);
    });

  } catch (error) {
    modalContent.textContent =
      "Could not load reports: " + error.message;
  }
}


/* LOG OUT */

async function logOut() {
  if (realtimeChannel) {
    await db.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  await db.auth.signOut();

  currentUser = null;
  currentRoom = null;
  currentUsername = "";
  isAdmin = false;
  rooms = [];
  currentMessages = [];

  showLogin();
}


/* BUTTON EVENTS */

document.getElementById("signupButton")
  .addEventListener("click", signUp);

document.getElementById("loginButton")
  .addEventListener("click", logIn);

document.getElementById("messageForm")
  .addEventListener("submit", sendMessage);

document.getElementById("logoutButton")
  .addEventListener("click", logOut);

document.getElementById("createRoomButton")
  .addEventListener("click", createRoom);

document.getElementById("reportsButton")
  .addEventListener("click", viewReports);

document.getElementById("closeModalButton")
  .addEventListener("click", closeModal);

reportPanel.addEventListener("click", event => {
  if (event.target === reportPanel) {
    closeModal();
  }
});


/* CHECK EXISTING LOGIN */

async function initialise() {
  if (!window.supabase) {
    showAuthMessage("Supabase library could not load. Check your internet connection.");
    return;
  }

  try {
    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (data.session?.user) {
      await startApp(data.session.user);
    }
  } catch (error) {
    console.error(error);
    showAuthMessage("Could not connect to Supabase: " + error.message);
  }
}


/* AUTH STATE CHANGES */

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session?.user) {
    startApp(session.user);
  }

  if (event === "SIGNED_OUT") {
    currentUser = null;
    showLogin();
  }
});

initialise();

</script>
